<!doctype html>
<html><head><meta charset="utf-8"><title>QS review</title>
<style>
:root { --bg: #fff; --fg: #1d2125; --muted: #6b7280; --line: #e5e7eb; --head: #f3f4f6; --link: #0b63c4;
        --bad: #fde2e2; --badfg: #9b1c1c; }
@media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
        --head: #1a1f25; --link: #6cb6ff; --bad: #3b1d1d; --badfg: #ffb4b4; } }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; margin: 0 16px 80px; }
header { position: sticky; top: 0; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line);
         display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 2; }
header input[type=search] { padding: 5px 8px; min-width: 260px; }
button { padding: 5px 10px; cursor: pointer; }
#stats { color: var(--muted); }
details { border: 1px solid var(--line); border-radius: 6px; margin: 10px 0; }
summary { background: var(--head); padding: 6px 10px; cursor: pointer; font-weight: 600; }
summary .n { color: var(--muted); font-weight: 400; }
table { border-collapse: collapse; width: 100%; }
td { border-top: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
td.c { width: 22px; } td.q { white-space: nowrap; width: 1%; } td.t { width: 22%; }
td.s { color: var(--fg); }
tr.bad td { background: var(--bad); } tr.bad td.s { color: var(--badfg); text-decoration: line-through; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
.hide { display: none; }
</style></head><body>
<header>
  <strong>corrections_qs.txt</strong>
  <input type="search" id="f" placeholder="Filter (class, title, sentence)">
  <button id="open">Expand all</button><button id="close">Collapse all</button>
  <button id="ok">Copy approved QS</button><button id="no">Copy rejected</button>
  <span id="stats"></span>
</header>
<main id="m"></main>

4 August 4 Aug"], ["Q123692495", "P31", "Q13406463", "Athletics at the 2022 Bolivarian Games – Results", "These are the full results of the athletics competition at the 2022 Bolivarian Games which took place between 1 and 5 July 2022 in Valledupar, Colombia. 4 July 5 July 1 July 1 July 4 July 5 July 2 July Wind: +1.6 m/s 4 July 2 July 4 July 5 July 1 July 2 July 2 July 5 July 1 July 3 July 5 July 1–2 Ju"], ["Q123858135", "P31", "Q13406463", "Athletics at the 2017 Bolivarian Games – Results", "These are the full results of the athletics competition at the 2017 Bolivarian Games which took place between 21 and 25 November 2017 at the Bureche Athletics Stadium in Santa Marta, Colombia. 23 November 21 November 24 November 22 November 25 November 21 November Wind: +0.8 m/s 23 November 24 Novem"], ["Q136849439", "P31", "Q13406463", "Athletics at the 2025 Islamic Solidarity Games – Results", "These are the results of the athletics competition at the 2025 Islamic Solidarity Games which took place on 17—20 November 2025 in Riyadh, Saudi Arabia. 20 November 18 November 18 November 17 November 19 November 20 November 18 November 17 November 20 November 18 November 18 November 20 November 17 "], ["Q137480722", "P31", "Q13406463", "Athletics at the 2025 Bolivarian Games – Results", "These are the full results of the athletics competition at the 2025 Bolivarian Games which took place between 23 November and 6 December 2025 at the VIDENA Stadium in Lima, Peru. 2 December Wind: +0.1 m/s 4 December 3 December 4 December 2 December 23 November 4 December Wind: -2.1 m/s 1 December 5 "], ["Q115812277", "P31", "Q13406463", "2022 ENNIE Award winners", "The following are the winners of the 22nd annual ENnie Awards, held in 2022: Judges' Spotlight Winners: Amelia Antrim – Dwelling, Good Luck Press Author: Seb Pines Di – Stack of Goblins, CobblePath Games Author: Jack Milton Christopher Gath – Shanty Hunters, Molten Sulfur Press Author: Tristan Zimme"], ["Q1395243", "P279", "Q1729207", "Inter-generational ministry", "Inter-generational ministry or intergenerational ministry is a model of Christian ministry which emphasizes relationships between age groups and encourages mixed-age activities."], ["Q129157445", "P279", "Q1729207", "Clown ministry", "Clown ministry is a type of Christian ministry involving clowns."], ["Q5053282", "P279", "Q1729207", "Catholic campus ministry", "Catholic campus ministry is the practice of organizing and coordinating ministry or service of the Catholic Church on the campus of a school, college, or university."], ["Q115516561", "P279", "Q11345", "Fuzzy differential equation", "Fuzzy differential equation are general concept of ordinary differential equation in mathematics defined as differential inclusion for non-uniform upper hemicontinuity convex set with compactness in fuzzy set. d x ( t ) / d t = F ( t , x ( t ) , α ) , {\\displaystyle dx(t)/dt=F(t,x(t),\\alpha ),} for "], ["Q129254898", "P31", "Q273120", "2005 Inuvil shooting and protests", "On 4 August 2005, a barber was accidentally shot dead by soldiers in Inuvil in northern Sri Lanka."], ["Q129254898", "P31", "Q2252077", "2005 Inuvil shooting and protests", "On 4 August 2005, a barber was accidentally shot dead by soldiers in Inuvil in northern Sri Lanka."], ["Q4447674", "P279", "Q1386603", "Secret sharing using the Chinese remainder theorem", "Secret sharing consists of recovering a secret S from a set of shares, each containing partial information about the secret."]]}, WIKI = "en", KEY = "qsreview:" + "corrections_qs.txt";
let bad = new Set();
try { bad = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...bad])); } catch (e) {} stats(); };
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const groups = {};
DATA.rows.forEach(r => (groups[r[1] + " " + r[2]] ||= []).push(r));
const m = document.getElementById("m");
Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length).forEach(g => {
  const [p, c] = g.split(" "), rows = groups[g];
  const d = document.createElement("details");
  d.innerHTML = `<summary>${p} <a href="https://www.wikidata.org/wiki/${c}" target="_blank">${esc(DATA.label[c] || c)}</a>
    <span class="n">(${c}, ${rows.length})</span></summary><table>${rows.map(r =>
    `<tr data-k="${r[0]}	${r[1]}	${r[2]}"><td class="c"><input type="checkbox" title="reject"></td>
     <td class="q"><a href="https://www.wikidata.org/wiki/${r[0]}" target="_blank">${r[0]}</a></td>
     <td class="t"><a href="https://${WIKI}.wikipedia.org/wiki/${encodeURIComponent(r[3].replace(/ /g, "_"))}"
       target="_blank">${esc(r[3])}</a></td><td class="s">${esc(r[4])}</td></tr>`).join("")}</table>`;
  m.appendChild(d);
});
document.querySelectorAll("tr[data-k]").forEach(tr => {
  const cb = tr.querySelector("input"), k = tr.dataset.k;
  if (bad.has(k)) { cb.checked = true; tr.classList.add("bad"); }
  cb.onchange = () => { cb.checked ? bad.add(k) : bad.delete(k); tr.classList.toggle("bad", cb.checked); save(); };
});
function stats() { document.getElementById("stats").textContent =
  `${DATA.rows.length} rows, ${bad.size} rejected, ${DATA.rows.length - bad.size} approved`; }
stats();
document.getElementById("f").oninput = e => {
  const t = e.target.value.toLowerCase();
  document.querySelectorAll("details").forEach(d => {
    let any = false;
    d.querySelectorAll("tr").forEach(tr => {
      const hit = !t || d.querySelector("summary").textContent.toLowerCase().includes(t) ||
                  tr.textContent.toLowerCase().includes(t);
      tr.classList.toggle("hide", !hit); any ||= hit; });
    d.classList.toggle("hide", !any); if (t && any) d.open = true; });
};
document.getElementById("open").onclick = () => document.querySelectorAll("details").forEach(d => d.open = true);
document.getElementById("close").onclick = () => document.querySelectorAll("details").forEach(d => d.open = false);
const copy = (lines, what) => navigator.clipboard.writeText(lines.join("\n") + "\n")
  .then(() => alert(`${lines.length} ${what} lines copied`));
document.getElementById("ok").onclick = () =>
  copy(DATA.rows.map(r => r.slice(0, 3).join("\t")).filter(k => !bad.has(k)), "approved");
document.getElementById("no").onclick = () => copy([...bad], "rejected");
</script></body></html>

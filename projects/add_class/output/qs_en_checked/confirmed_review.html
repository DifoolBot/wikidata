r."], ["Q112665762", "P279", "Q200779", "Anonychia-onychodystrophy with brachydactyly type B and ectrodactyly", "Anonychia-onychodystrophy with brachydactyly type B and ectrodactyly is a very rare autosomal dominant disorder which is characterized by onychodystrophy, anonychia, fifth finger brachydactyly, thumb digitalization, and missing to underdeveloped distal phalanges of the fingers."], ["Q618343", "P279", "Q2095", "Apple chip", "Apple chips are chips or crisps that are prepared using apples."], ["Q6904677", "P279", "Q2095", "Monte Carlo (biscuit)", "Monte Carlo biscuits are an Australian sweet biscuit that have been manufactured since 1926 by Arnott's Biscuits Holdings."], ["Q48970599", "P279", "Q2095", "Pagash", "Pagash, pagach, or pagac is a food made of mashed potatoes, dough, and cheese."], ["Q65041794", "P279", "Q2095", "Kānga pirau", "Kānga pirau (which translates literally from Māori as rotten corn), is a fermented maize (corn) porridge dish which is considered a delicacy by many Māori people of New Zealand."], ["Q5051387", "P279", "Q2281940", "Catalytic combustion", "Catalytic combustion is a chemical process which uses a catalyst to speed desired oxidation reactions of fuel and so reduce the formation of undesired products, especially pollutant nitrogen oxide gases (NOx) far below what can be achieved without catalysts."], ["Q5463812", "P279", "Q2281940", "Foam separation", "Foam separation is a chemical process which falls into a category of separation techniques called \"Adsorptive bubble separation methods\"."], ["Q7565086", "P279", "Q25403900", "Sour sanding", "Sour sanding, or sour sugar, is a food ingredient that is used to impart a sour flavor to candy."], ["Q3945678", "P279", "Q2596997", "Salmoriglio", "Salmoriglio is a southern Italian condiment made of lemon juice, olive oil, garlic, salt, and herbs (such as oregano and parsley)."], ["Q7190750", "P279", "Q2596997", "Pickapeppa Sauce", "Pickapeppa Sauce, also known as Jamaican ketchup, is a b e late 19th century, in 1896."], ["Q16994511", "P279", "Q34493", "Hyde Harrier", "The Hyde Harrier is a British sports motorcycle designed by Norman Hyde and unveiled at the British motorcycle show in 1987."], ["Q18347769", "P279", "Q34493", "Gyronaut X-1", "Gyronaut X-1 was a streamliner motorcycle that set the motorcycle land-speed record of 245.667 mph (395.363 km/h) in 1966, ridden by Detroit Triumph dealer Bob Leppan."], ["Q19895488", "P279", "Q34493", "Bajaj Pulsar NS200", "The Bajaj Pulsar NS200, previously known as Bajaj Pulsar 200NS or Bajaj Pulsar 200 Naked Sports, is a sports bike made by Indian motorcycle manufacturer Bajaj Auto."], ["Q24911763", "P279", "Q34493", "Yamaha SZ RR", "The Yamaha SZ RR is a motorbike designed by the Yamaha Corporation."], ["Q25067255", "P279", "Q34493", "Yamaha DT125RE", "The Yamaha DT 125 RE is a trail bike produced from 2004 to 2007 (some can have 2008 as the registration year)."], ["Q27961713", "P279", "Q34493", "Streamlined motorcycle", "A streamlined motorcycle is a motorcycle with a fairing that goes beyond a 'full' or 'dustbin' fairing, to form an aerodynamic shell to minimize drag."], ["Q28154821", "P279", "Q34493", "Yamaha CT2", "The Yamaha CT2 was a popular 175cc Trail/Enduro motorcycle."], ["Q30639567", "P279", "Q34493", "Yamaha TTR230", "The Yamaha TT-R230 is a trail bike that Yamaha produced from 2005–present."], ["Q48789896", "P279", "Q34493", "Honda XR100R", "The Honda XR100R is a four-stroke off-road motorcycle introduced in 1985, four years after the introduction of the XR100."], ["Q96382084", "P279", "Q34493", "Indian FTR", "The Indian FTR (formerly FTR 1200) is a standard motorcycle manufactured by Polaris Inc. under the Indian Motorcycle marque since 2019."], ["Q96386936", "P279", "Q34493", "Lark Streamliner", "The Lark Streamliner is an electric streamliner motorcycle built to challenge the standing land speed record for two-wheeled vehicles."], ["Q104857298", "P279", "Q34493", "Harley-Davidson Bronx", "The Bronx was a motorcycle announced by Harley-Davidson in 2018 for the 2020 model year, alongside the adventure motorcycle-styled Pan America."], ["Q107404580", "P279", "Q34493", "Norton Model 77 Dominator", "The 1st Norton Model 77 Dominator was a 500 cc all iron vertical twin rigid framed Norton motorcycle manufactured by Norton Motors Ltd from 1950 to 1952."], ["Q107862512", "P279", "Q34493", "Yamaha TTR125", "The Yamaha TT-R125 is a trail bike that Yamaha produced from 2000–present."], ["Q110517354", "P279", "Q34493", "Bajaj Pulsar N250", "The Bajaj Pulsar N250 is a Naked bike made by Indian motorcycle manufacturer Bajaj Auto."], ["Q115802147", "P279", "Q34493", "Suzuki TR500", "Suzuki TR500 was a Japanese road racing motorcycle manufactured by Suzuki which first edition was seen in 1968 with Frank Perris as rider, and then competed in the 500cc class of Grand Prix motorcycle racing from 1969 to 1973."], ["Q128304327", "P279", "Q34493", "Honda CL500", "The Honda CL500 (also called the Honda SCL500 in North America) is a standard motorcycle produced by Honda since 2023."], ["Q131447897", "P279", "Q34493", "Arc Vector", "Arc Vector is an electric motorcycle made by British motorcycle manufacturer Arc Vehicles from 2017 to 2019 and by the company's successor Arc V from 2022 to 2024."], ["Q5018787", "P279", "Q36534", "Calciothermic reaction", "Calciothermic reactions are metallothermic reduction reactions (more generally, thermic chemical reactions) which use calcium metal as the reducing agent at high temperature."], ["Q16982511", "P279", "Q36534", "Hydroalkoxylation", "Hydroalkoxylation is a chemical reaction that combines alcohols with alkenes or alkynes."], ["Q55523993", "P279", "Q36534", "Aston–Greenburg rearrangement", "The Aston–Greenburg rearrangement is a name reaction in organic chemistry."], ["Q108101399", "P279", "Q36534", "Hurd–Mori 1,2,3-thiadiazole synthesis", "The Hurd–Mori 1,2,3-thiadiazole synthesis is a name reaction in organic chemistry that allows for the generation of 1,2,3-thiadiazoles through the reaction of hydrazone derivatives with an N-acyl or N-tosyl group reacted with thionyl chloride."], ["Q105123576", "P279", "Q37756", "1070 aluminium alloy", "1070 is a pure aluminium alloy."], ["Q113493034", "P279", "Q37756", "Alloy 601", "Alloy 601 is a nickel alloy, mostly made up of nickel and chromium, with small amounts of aluminium, silicon, copper and manganese."], ["Q288078", "P279", "Q391414", "Peristasis (architecture)", "The peristasis (Ancient Greek: περίστασις) was a four-sided porch or hallway of columns surrounding the cella (naos) in an ancient Greek peripteral temple."], ["Q2583974", "P279", "Q391414", "Wind brace", "In architecture, wind braces are diagonal braces to tie the rafters of a roof together and prevent racking."], ["Q4737553", "P279", "Q391414", "Alure", "An alure (O. Fr., from aller, \"to walk\") or allure is an architectural term for an alley, passage, the water-way or flat gutter behind a parapet, the galleries of a clerestory, or sometimes even the aisle itself of a church."], ["Q4787057", "P279", "Q391414", "Architectural ironmongery", "Architectural ironmongery or architectural hardware is a term used for the manufacture and wholesale distribution of items made from iron, steel, brass, aluminium or other metals, including plastics, for use in all types of buildings."], ["Q4921857", "P279", "Q391414", "Minstrels' gallery", "A minstrels' gallery is a form of balcony, often inside the great hall of a castle or manor house, and used to allow musicians (originally minstrels) to perform, sometimes discreetly hidden from the guests below."], ["Q5150815", "P279", "Q391414", "Combination stair", "A combination stair is an architectural element found in traditional houses in North America where two sets of stairs merge into one at a landing."], ["Q7617243", "P279", "Q391414", "Stillicidium", "Stillicidium, a dripping of water from the eaves (stilla, drop, cadere, to fall), is the term in architecture given by Vitruvius (v. 7) to the dripping eaves of the roof of the Etruscan temple."], ["Q7978382", "P279", "Q391414", "Weavers' windows", "Weavers' windows are large horizontal windows on the top floor of a weavers' cottage that allowed the residents light to weave."], ["Q65072808", "P279", "Q391414", "Tourelle (architecture)", "A tourelle is a type of turret, sometimes used in Chateauesque architecture."], ["Q996981", "P279", "Q39546", "Pig scalder", "A pig scalder is a tool that is used to soften the skin of a pig after they have been killed."], ["Q1498583", "P279", "Q39546", "Miter clamp", "Mitre clamps or miter clamps are clamps designed to hold mitre joints together."], ["Q4860872", "P279", "Q39546", "Bark hack", "A bark (or turpentine) hack is a tool used to remove pine tree bark to promote the flow of pine resin, which is used in naval stores production."], ["Q5137565", "P279", "Q39546", "Coa de jima", "A coa de jima or coa (\"hoe for harvesting\", \"hoe\") is a specialized tool for harvesting agaves."], ["Q5256563", "P279", "Q39546", "Denailer", "A denailer is a tool for removing nails from lumber to facilitate its reuse."], ["Q5358562", "P279", "Q39546", "Electrostatic fieldmeter", "An electrostatic fieldmeter, also called a static meter or electrostatic voltmeter is a tool used primarily in the static control industry for non-contact measurement of electrostatic fields and surface potentials."], ["Q5377738", "P279", "Q39546", "Engine crane", "An engine crane (also referred as engine hoist) is a common repair tool used in vehicle repair shops to remove or install gasoline or diesel engines in small and crowded vehicle engine compartments."], ["Q5502128", "P279", "Q39546", "French flush-cut saw", "A French flush-cut saw is a double-edged tool, similar to a veneer saw, that is designed for trimming the ends of dowels, tenons, and other protrusions flush with a surface."], ["Q5656656", "P279", "Q39546", "Hardy tool", "Hardy tools, also known as anvil tools or bottom tools, are metalworking tools used in anvils."], ["Q6667342", "P279", "Q39546", "Loggerhead (tool)", "A loggerhead is a type of tool consisting of a ball or bulb (for example, of iron) which would be heated up attached to a long handle."], ["Q7070399", "P279", "Q39546", "Nut driver", "A nutdriver or nut driver is a hand tool for tightening or loosening nuts and bolts."], ["Q7248263", "P279", "Q39546", "Profile gauge", "A profile gauge or contour gauge is a tool for recording the cross-sectional shape of a surface."], ["Q7578570", "P279", "Q39546", "Spline roller", "A screen roller or spline roller is a small hand tool used to press screen mesh into the edges of a window frame that is fluted on the inner edges, or to press in the retainer spline that holds that mesh in place."], ["Q7600450", "P279", "Q39546", "Staple knocker", "A staple knocker is a tool resembling a screwdriver, used for removing staples and shredded material."], ["Q7605352", "P279", "Q39546", "Steam box", "A steam box is a long, sealed container used to steam wooden planks for the purpose of making them pliable."], ["Q7617639", "P279", "Q39546", "Stitch holder", "Stitch holders are tools that are used in knitting to hold open stitches when not being used by the needles."], ["Q7684628", "P279", "Q39546", "Taping knife", "A taping knife or joint knife is a drywall tool with a wide blade for spreading joint compound, also known as \"mud\"."], ["Q7837626", "P279", "Q39546", "Tree planting bar", "A tree planting bar or dibble bar is a tool used by foresters to plant trees, especially in large-scale afforestation or reforestation."], ["Q7978167", "P279", "Q39546", "Weasand clip", "A weasand clip is a meatpacking industry tool used in the slaughter of ruminant animals in an industrial slaughterhouse setting."], ["Q7997627", "P279", "Q39546", "Whoopie sling", "A whoopie sling is an easily adjustable rope sling designed for tree pruning or tree removal."], ["Q16895820", "P279", "Q39546", "Daisy grubber", "A daisy grubber is a garden tool that is used to pull out roots."], ["Q18389091", "P279", "Q39546", "Podger spanner", "A podger spanner, or podger, is a tool in the form of a short bar, usually tapered and often incorporating a wrench at one end."], ["Q19599533", "P279", "Q39546", "Propane burnisher", "A propane burnisher is a type of rotary floor burnisher, a floor buffing (polishing) device, that is powered by propane."], ["Q30673355", "P279", "Q39546", "Bead roller", "A bead roller is a machine tool that makes rigid lines in sheet metal to make surfaces more rugged and durable."], ["Q1954144", "P279", "Q39888", "Pubovesical ligament", "The pubovesical ligament is a ligament that extends from the neck of the urinary bladder to the inferior aspect of the pubis bones."], ["Q5145988", "P279", "Q39888", "Collateral ligament of interphalangeal joints of hand", "The collateral ligaments of interphalangeal joints are ligaments of the interphalangeal joints of the hand."], ["Q6045503", "P279", "Q39888", "Interarytenoid fold", "The interarytenoid fold is a small ligament in the posterior larynx."], ["Q2031655", "P279", "Q40050", "Naqe'e Al Zabib", "Naqe'e al zabib (Arabic: نقيع الزبيب, romanized: naqīʿ az-zabīb, lit. ''raisin infusion'') is a raisin beverage from Yemen."], ["Q16888336", "P279", "Q40050", "Tortuga (cocktail)", "A Tortuga cocktail is a non-alcoholic beverage named for the Haitian island Tortuga of northern Hispaniola that was used by pirates as a launching ground for piracy activities."], ["Q65067396", "P279", "Q40050", "Intus", "Intus was a traditional pre-colonial Filipino alcoholic drink from the Visayas Islands and Mindanao."], ["Q104879171", "P279", "Q40050", "Frosé (drink)", "Frosé is a mixed drink made from rosé wine frozen to a slush, with strawberries, vodka, and lemon juice."], ["Q111915128", "P279", "Q40050", "Chulli", "Chulli is an alcoholic drink produced in Himachal Pradesh, India."], ["Q111939598", "P279", "Q40050", "Lugdi", "Lugdi or Jhol (Hindi: Jhol) is an alcoholic drink produced North Indian state of Himachal Pradesh."], ["Q131126000", "P279", "Q40050", "Mangisi", "Mangisi is a traditional sweet-sour beverage made through the natural fermentation of millet mash and is native to Zimbabwe."], ["Q1139205", "P279", "Q41207", "Crazia", "The crazia, plural crazie (from the German: Kreuzer), was an alloy coin with a value of 5 quattrini issued from the reign of Cosimo I de' Medici, first Grand Duke of Tuscany (1537 - 1574), onwards."], ["Q2231291", "P279", "Q41207", "Scharfrichterpfennig", "The Scharfrichterpfennig (\"Executioner's Penny\") was a silver medal weighing a double thaler, which the incumbent executioner presented to the oldest judge of the city of Hamburg when he retired from the court."], ["Q3641525", "P279", "Q41207", "Bodle", "A bodle or boddle or bodwell, also known as a half groat or Turner, was a Scottish copper coin, of less value than a bawbee, worth about one-sixth of an English penny."], ["Q3897564", "P279", "Q41207", "Maltese pataca", "The pataca of Malta was a large copper coin[citation needed] minted between the 16th and 17th centuries as a fiduciary coin – that is, a coin whose face value was worth more than its composition."], ["Q55609257", "P279", "Q41207", "Decaen piastre", "The Decaen piastre was a coin that Governor Decaen had minted at Île of France in 1810."], ["Q65045826", "P279", "Q41207", "World War I Centennial silver dollar", "The World War I Centennial silver dollar is a commemorative coin issued by the United States Mint in 2018."], ["Q65045838", "P279", "Q41207", "US Capitol Bicentennial silver dollar", "The US Capitol Bicentennial silver dollar is a commemorative coin issued by the United States Mint in 1994."], ["Q65090325", "P279", "Q41207", "Robert F. Kennedy silver dollar", "The Robert F. Kennedy silver dollar is a commemorative coin issued by the United States Mint in 1998."], ["Q107377335", "P279", "Q41207", "Women's Suffrage Centennial silver dollar", "The Women's Suffrage Centennial silver dollar is a commemorative coin which was issued by the United States Mint in 2020."], ["Q16608468", "P279", "Q41415", "Mole de olla", "Mole de olla is a Mexican traditional soup made of beef chuck (aguja), beef shank (chambarete), xoconostle (a kind of edible cactus), chayote, zucchini, green beans, corn, potatoes, and cabbage flavored with a thin mole of ground chile guajillo, chile pasilla, garlic, onion, and epazote."], ["Q17044517", "P279", "Q41415", "Sinabawang gulay", "Sinabawang gulay, usually anglicized as Filipino vegetable soup, is a Filipino vegetable soup made with leafy vegetables (usually moringa leaves) and various other vegetables in a broth seasoned with seafood stock or patis (fish sauce)."], ["Q60750048", "P279", "Q41415", "Tapado", "Tapado is a seafood soup served in Central American countries such as Guatemala and Honduras."], ["Q65117153", "P279", "Q41415", "Soup du Barry", "Soup du Barry (French: potage Dubarry, velouté Dubarry or crème Dubarry) is a French soup made from cauliflower, potatoes, and stock (traditionally veal stock)."], ["Q5051935", "P279", "Q42889", "Caterpillar 924G", "Caterpillar 924G is a small size wheel loader manufactured by Caterpillar Inc. Introduced in the year 2000, it remained in production until 2008."], ["Q7830892", "P279", "Q42889", "Toyota Trailer T10", "The Toyota Trailer T10 was a trailer manufactured by Toyota that was designed to go behind the Toyota Land Cruiser or the Toyota Weapon Carrier using a ring hitch."], ["Q11802031", "P279", "Q42889", "PZInż 703", "PZInż 703 and its development versions PZInż 713 and PZInż 723 were a family of Polish trucks, lorries, buses and artillery trailers."], ["Q15836957", "P279", "Q42889", "Gari (vehicle)", "A gari (Swahili for 'cart'; Amharic: ጋሪ) is a horse-drawn cart."], ["Q15909376", "P279", "Q42889", "Navia (vehicle)", "The Navia is an electric 10-passenger robo-driven vehicle made by France's Induct Technology."  by Weatherby Inc, but has been discontinued."], ["Q15990732", "P279", "Q486396", "Winchester Model 20", "The Winchester Model 20 is a single-barreled shotgun that was produced from 1920 to 1924."], ["Q17621961", "P279", "Q486396", "Beretta Tx4 Storm", "The Beretta Tx4 Storm is a tactical semi-automatic shotgun produced by Beretta."], ["Q25051691", "P279", "Q486396", "Brixia PM-5", "The Brixia PM-5 is an Italian pump-action shotgun manufactured by Brixia Shotguns."], ["Q39054699", "P279", "Q486396", "Intrepid RAS-12", "The Intrepid RAS-12/AR-12 is a semi auto shotgun derived from the AR-10 platform and manufactured by Intrepid Tactical Solutions."], ["Q39058651", "P279", "Q486396", "UTAS XTR-12", "The UTAS XTR-12 is a semi automatic shotgun manufactured by UTAS Defence of Turkey."], ["Q48989839", "P279", "Q486396", "Beretta 1200 FP", "The Beretta 1200 FP is a semi-automatic shotgun developed in the late 1980s or early 1990s by the Italian arms manufacturing company Fabbrica d'Armi Pietro Beretta."], ["Q55602914", "P279", "Q486396", "AAI CAWS", "The AAI CAWS (Close Assault Weapon System) is a prototype automatic shotgun—designed as a combat shotgun— produced by the AAI Corporation during the 1980s."], ["Q55621113", "P279", "Q486396", "Ljutic Space Gun", "The Ljutic Space Gun is a 12 gauge single-shot shotgun intended for trap shooting."], ["Q65049522", "P279", "Q486396", "IWI Tavor TS12", "The IWI Tavor TS12 is an Israeli semi-automatic bullpup shotgun, based on the IWI Tavor assault rifle."], ["Q97184271", "P279", "Q486396", "Walther automatic shotgun", "The Walther automatic shotgun is a German self-loading shotgun that was produced by Walther."], ["Q97194769", "P279", "Q486396", "Smith & Wesson Elite Series", "The Smith & Wesson Elite Series are break-open shotguns offered by Smith & Wesson circa 2007 to 2010."], ["Q97308276", "P279", "Q486396", "Pindad SG1", "The Pindad SG1 (Indonesian: Senapan Gentel 1/Senapan Gotri 1; lit. 'Shotgun 1') is a 12-gauge shotgun produced by Pindad."], ["Q97353937", "P279", "Q486396", "Smith & Wesson 1000 Series", "The Smith & Wesson 1000 Series are semi-automatic shotguns offered by Smith & Wesson circa 2007 to 2010."], ["Q97353989", "P279", "Q486396", "Smith & Wesson Model 1000", "The Smith & Wesson Model 1000 is a semi-automatic shotgun offered in 12 and 20 gauge by Smith & Wesson during the 1970s and 1980s."], ["Q97354009", "P279", "Q486396", "Smith & Wesson Model 916", "The Smith & Wesson Model 916 is a pump-action 12-gauge shotgun produced by Smith & Wesson during the 1970s."], ["Q15730611", "P279", "Q527395", "Carrick bend loop", "A carrick loop is a knot used to make a reliable and stable loop at the end of a rope formed by the tail turned around and attached to the main part using a carrick bend."], ["Q16258641", "P279", "Q527395", "Tensionless hitch", "A Tensionless hitch is an anchor knot used for rappelling or rope rescue."], ["Q18356339", "P279", "Q527395", "Offset figure-eight bend", "The offset figure-eight bend is a poor knot that has been implicated in the deaths of several rock climbers.[failed verification] The knot may capsize (invert) under load, as shown in the figure, and this can happen repeatedly."], ["Q4244226", "P279", "Q56139", "Hrenovuha", "Hrenovuha (Ukrainian: хріновуха, romanized: khrinovukha, Russian: хреновуха, romanized: khrenovukha) is a type of strong vodka, traditional in Russia, Ukraine and Belarus."], ["Q920326", "P279", "Q649107", "Sodegarami", "The sodegarami (袖搦, sleeve entangler) is a polearm that was used by the samurai class and their retainers in feudal Japan."], ["Q1622843", "P279", "Q649107", "Hoeroa", "A hoeroa is a type of traditional hand weapon of the Māori, the indigenous people of New Zealand."], ["Q2087832", "P279", "Q649107", "Menaulion", "The menaulion or menavlion (Greek: μεναύλιον), also menaulon or menavlon (μέναυλον) was a heavy spear with a length of 2.7 to 3.6 m (8 ft 10 in to 11 ft 10 in) with a thick shaft, used by the Byzantine nown as a smiley, is an improvised weapon which consists of a length of chain or strong cloth attached to a large lock or other piece of metal."], ["Q5166495", "P279", "Q728", "Converted Flamethrower 40", "Umgebauter Flammenwerfer 40 (Converted Flamethrower 40) is a backpack flamethrower converted to shoot a powerful jet of water solution of CN gas as a riot control device."], ["Q5305313", "P279", "Q728", "Dragon beard hook", "The Chinese dragon beard hook (also known as the Longxu hook) is a thrown entangling/trapping concealable weapon."], ["Q5358071", "P279", "Q728", "Electromagnetic Personnel Interdiction Control", "Electromagnetic Personal Interdiction Control (E.P.I.C.) is a weapon of the U.S. Navy that works by sending out an electromagnetic pulse that affects the sense of balance and makes the target feel ill and throw up."], ["Q5610582", "P279", "Q728", "Grossflammenwerfer", "The Grossflammenwerfer or Grof is a large flamethrower, designed to be used from the trenches."], ["Q6359217", "P279", "Q728", "Seitengewehr 42", "The Seitengewehr 42 (bayonet model 1942), also called the Infanteriemesser 42 or Kampfmesser 42, was a bayonet and multi-purpose knife used by the Wehrmacht."], ["Q7262972", "P279", "Q728", "Pyeongon", "The Pyeongon is a nunchaku/Flail-like weapon used by the Joseon army and is first mentioned in a martial arts manual called Muyesinbo."], ["Q7504620", "P279", "Q728", "Shuckra", "A shuckra is a weapon of Indian heritage and consists of a series of metal tubes on a wire connected to a (metal) handle."], ["Q7672867", "P279", "Q728", "Tabak-Toyok", "The tabak-toyok (sometimes colloquially referred to as chako) is a Filipino flail weapon consisting of a pair of sticks connected by a chain."], ["Q7858748", "P279", "Q728", "Two-section staff", "The two-section staff or changxiaobang (Chinese: 長小棒; pinyin: cháng xiǎo bàng; lit. 'long/short pole') is a versatile weapon which originated in China from the ancient Shaolin temple and Shaolin martial arts        target="_blank">${esc(r[3])}</a></td><td class="s">${esc(r[4])}</td></tr>`).join("")}</table>`;
  m.appendChild(d);
});
document.querySelectorAll("tr[data-k]").forEach(tr => {
  const cb = tr.querySelector("input"), k = tr.dataset.k;
  if (bad.has(k)) { cb.checked = true; tr.classList.add("bad"); }
  cb.onchange = () => { cb.checked ? bad.add(k) : bad.delete(k); tr.classList.toggle("bad", cb.checked); save(); };
});
function stats() { document.getElementById("stats").textContent =
  `${DATA.rows.length} rows, ${bad.size} rejected, ${DATA.rows.length - bad.size} approved`; }
stats();
document.getElementById("f").oninput = e => {
  const t = e.target.value.toLowerCase();
  document.querySelectorAll("details").forEach(d => {
    let any = false;
    d.querySelectorAll("tr").forEach(tr => {
      const hit = !t || d.querySelector("summary").textContent.toLowerCase().includes(t) ||
                  tr.textContent.toLowerCase().includes(t);
      tr.classList.toggle("hide", !hit); any ||= hit; });
    d.classList.toggle("hide", !any); if (t && any) d.open = true; });
};
document.getElementById("open").onclick = () => document.querySelectorAll("details").forEach(d => d.open = true);
document.getElementById("close").onclick = () => document.querySelectorAll("details").forEach(d => d.open = false);
const copy = (lines, what) => navigator.clipboard.writeText(lines.join("\n") + "\n")
  .then(() => alert(`${lines.length} ${what} lines copied`));
document.getElementById("ok").onclick = () =>
  copy(DATA.rows.map(r => r.slice(0, 3).join("\t")).filter(k => !bad.has(k)), "approved");
document.getElementById("no").onclick = () => copy([...bad], "rejected");
</script></body></html>

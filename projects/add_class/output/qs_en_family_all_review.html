g death of a ten-year deputy sheriff of the Harris County Sheriff's Office on August 28, 2015."], ["Q28405535", "P31", "Q132821", "Murder of Benjamin Marconi", "On November 20, 2016, Benjamin Marconi, a detective with the San Antonio Police Department, was shot to death in San Antonio, Texas."], ["Q29026019", "P31", "Q132821", "Murder of Shamim Reza Rubel", "The murder of Shamim Reza Rubel is the murder of a private university student that took place in police custody and created a landmark legal case in Bangladesh."], ["Q39053677", "P31", "Q132821", "Murder of Stephen Carroll", "On 9 March 2009, Stephen Carroll, a 48‑year‑old Police Service of Northern Ireland (PSNI) officer, was killed by the Continuity IRA in Craigavon, County Armagh."], ["Q39057625", "P31", "Q132821", "Murder of Vicente Bermúdez Zacarías", "On 17 October 2016, Mexican federal judge Vicente Bermúdez Zacarías went on a morning jog near his home in Metepec, State of Mexico, an upscale community outside of Mexico City."], ["Q56311046", "P31", "Q132821", "Murder of Gasanguseynovy brothers", "The murder of brothers Gasanguseyn Gasanguseynov and Nabi Gasanguseynov occurred on August 23, 2016, near the village of Goor-Khindakh in the Shamilsky District of Dagestan."], ["Q60769976", "P31", "Q132821", "Murder of Ronil Singh", "Ronil Singh (April 6, 1985 – December 26, 2018) was a Fijian-born American police officer who was shot and killed on the morning of December 26, 2018, in Newman, California, by a driver he had pulled over on suspicion of driving while drunk."], ["Q60840086", "P31", "Q132821", "Murder of Antonella Di Veroli", "On 10 April 1994, 47-year-old Antonella Di Veroli was killed in her home in Rome, Italy."], ["Q63128657", "P31", "Q132821", "Murder of Nusrat Jahan Rafi", "Murder of Nusrat Jahan Rafi refers to the murder of a 19–year-old Bangladeshi female student who was murdered after reporting sexual assault by her Madrasa principal to authorities."], ["Q65091888", "P31", "Q132821", "Murder of Aaron Pajich", "On 13 June 2016, 18-year-old Aaron Lee Pajich-Sweetman disappeared from Rockingham, Western Australia."], ["Q85866259", "P31", "Q132821", "Murder of Marta Calvo", "Marta Calvo Burón was a 25-year-old Spanish woman who disappeared on 7 November 2019, in Manuel, Valencia after a date with a man she met on an online dating site."], ["Q107504176", "P31", "Q132821", "Murder of Generro Sanchez", "On December 5, 2012, Generro Sanchez was murdered in Asher, Oklahoma, United States, by Jerrod Murray, a fellow student at East Central University."], ["Q108178793", "P31", "Q132821", "Murder of Aya Hachem", "Aya Hachem was murdered in Blackburn, Lancashire, England on 17 May 2020."], ["Q111181757", "P31", "Q132821", "Murder of Marsh Cook", "F. M. B. \"Marsh\" Cook was a political candidate in Mississippi who was murdered by white supremacists for campaigning for a seat at Mississippi's 1890 Constitutional Convention."], ["Q111915501", "P31", "Q132821", "Murder of Vishwanath Shetty", "In 2015 Vishwanath Shetty was allegedly murdered by Popular Front of India (PFI) activists."], ["Q111951185", "P31", "Q132821", "Murder of Gon Ying Louis", "On September 30, 1909, 40-year-old Gon Ying Louis was shot and killed as she slept in the family home at Palm and Corro (or Chorro) streets, San Luis Obispo, California."], ["Q111982293", "P31", "Q132821", "Murder of Rikki Neave", "Rikki Neave was a six-year-old boy who was murdered on 28 November 1994 by a 13-year-old boy, James Watson, in Peterborough, England."], ["Q112132001", "P31", "Q132821", "Murder of Anesha Murnane", "On October 17, 2019, Anesha \"Duffy\" Murnane disappeared from Pioneer Avenue, the main thoroughfare of Homer, Alaska, in the middle of the day while walking to a medical appointment."], ["Q112578578", "P31", "Q132821", "Murder of Joanne Witt", "On the night of June 11, 2009, Joanne Witt was murdered by her teenage daughter Tylar and Tylar's boyfriend Steven \"Boston\" Colver, one or both of whom stabbed Witt 20 times on the upper half of her body."], ["Q113659342", "P31", "Q132821", "Murder of Indra Meghwal", "Indra Kumar Meghwal was a nine-year old Dalit boy studying in a Saraswati Vidya Mandir, a private school in Surana, a small village in Sayala, Jalore, Rajasthan."], ["Q115819898", "P31", "Q132821", "Murder of Arthur Collins", "Arthur F. Collins (1937 – October 9, 1965) was a 28-year-old man who was murdered in a New York City subway after defending two women who were being assaulted by an intoxicated man."], ["Q116470811", "P31", "Q132821", "Murder of Stuart Rattle", "Stuart Charles Rattle (16 November 1960 – 4 December 2013) was an Australian interior designer who was murdered by Michael Anthony O'Neill, his partner of 16 years, in their South Yarra home following an argument."], ["Q117425129", "P31", "Q132821", "Murder of Karen Toshima", "On January 30, 1988, 27-year-old graphic artist Karen Chikako Toshima was shot and later died in a hospital after she got caught in the crossfire between two rival gang members in Los Angeles, California."], ["Q119012024", "P31", "Q132821", "Murder of Shirley Soosay", "Shirley Ann Soosay (February 6, 1945 – July 13, 1980) was an Indigenous Canadian murder victim who was formerly an unidentified decedent known as Kern County Jane Doe."], ["Q119716211", "P31", "Q132821", "Murder of Spencer Tuppani", "On 10 July 2017, 69-year-old Tan Nam Seng (Chinese: 陈南成; Pe̍h-ōe-jī: Tân Nâm-sêng; born 1948) stabbed his son-in-law, 38-year-old Spencer Sanjay Tuppani Shamlal Tuppani, in broad daylight at Telok Ayer Street, Singapore."], ["Q122166884", "P31", "Q132821", "Murder of Solange Grabenheimer", "On 10 January 2007, 21-year-old Solange Grabenheimer was found stabbed and strangled in the second floor of her apartment in Florida, Buenos Aires, Argentina."], ["Q123133992", "P31", "Q132821", "Murder of Dariush Mehrjui", "On October 15, 2023, Iranian filmmaker Dariush Mehrjui and his wife, actress Vahideh Mohammadifar, were fatally stabbed by an unknown assailant at their residence at Zibadasht, near the city of Karaj."], ["Q123468508", "P31", "Q132821", "Murder of Richard Reihl", "On May 15, 1988, Wethersfield, Connecticut resident Richard Reihl, a gay man, was murdered by two teenagers."], ["Q124572330", "P31", "Q132821", "Murder of Ng Keng Hua", "On 27 February 1991, inside his home at Geylang, 32-year-old businessman Ng Keng Hua (Chinese: 黄庆华; pinyin: Huáng Qìnghuá; Pe̍h-ōe-jī: N̂g Khèng-hôa) was stabbed twice by two attackers during a robbery bid, and he died as a result of the stabbing while warded at a hospital."], ["Q124632713", "P31", "Q132821", "Murder of Tan Tiong Huat", "On 12 March 1997, a loan shark named Tan Tiong Huat (Chinese: 陈中发; pinyin: Chén Zhōngfā; Pe̍h-ōe-jī: Tân Tiong-hoat) was shot to death at a carpark in Singapore's Beach Road."], ["Q124669206", "P31", "Q132821", "Murder of Morris Adler", "On February 12, 1966, Richard Wishnetsky entered Congregation Shaarey Zedek in Southfield, Michigan, during weekly Shabbat services and, brandishing a firearm, ordered everyone except Rabbi Morris Adler off the synagogue's bimah."], ["Q124714562", "P31", "Q132821", "Murder of Harmony Montgomery", "Harmony Renee Montgomery (June 7, 2014 – disappeared c. 2019; declared legally dead March 12, 2024) was a 5-year-old American girl who was murdered by her biological father Adam Montgomery (overturned ruling) in Manchester, New Hampshire, after a Massachusetts judge awarded him custody in late 2019."], ["Q124749751", "P31", "Q132821", "Murder of Shankar Suppiahmaniam", "On 10 August 2001, at Queenstown Remand Prison in Singapore, 19-year-old Shankar Suppiahmaniam, a detainee who was charged with raping two young girls, was found dead inside his remand cell."], ["Q124785375", "P31", "Q132821", "Murder of Audrii Cunningham", "On February 15, 2024, 11-year-old Audrii Danielle Cunningham (born February 5, 2013) disappeared while traveling to her school bus stop in Livingston, Texas, United States."], ["Q125018136", "P31", "Q132821", "Murder of Lourdusamy Lenin Selvanayagan", "On 22 December 2001, inside his rented flat in Singapore's Marsiling, 23-year-old Lourdusamy Lenin Selvanayagan, a ship's electrician from India, was stabbed to death by one of his room-mates Arun Prakash Vaithilingam, who was his 23-year-old colleague from the same workplace."], ["Q125026808", "P31", "Q132821", "Murder of Jailyn Candelario", "In June 2023, Jailyn Candelario, a 16-month-old American girl from Cleveland, Ohio, was murdered in her home by her mother Kristel Candelario, who had left her abandoned for ten days while vacationing in Puerto Rico and Detroit."], ["Q125202789", "P31", "Q132821", "Murder of Rebekah Byler", "On February 26, 2024, Rebekah A. Byler, a 23-year-old Amish woman, was murdered in her home near Spartansburg, Pennsylvania, by Shawn Cranston of Corry, Pennsylvania."], ["Q125565230", "P31", "Q132821", "Murder of Karuppan Velusamy", "On 1 February 1973, 52-year-old Karuppan Velusamy, a one-armed jobless man, was brutally murdered while sleeping on a five-foot way street in Jalan Berseh, off Jalan Besar in Singapore."], ["Q125577722", "P31", "Q132821", "Murder of Suk Malasri", "On 17 June 1995, 23-year-old Thai forklift operator Suk Malasri (1972 – 17 June 1995) was found bludgeoned to death inside his living quarters at a construction site in Sungei Kadut, Singapore."], ["Q125635604", "P31", "Q132821", "Murder of Aditya Sachdeva", "The Aditya Sachdeva murder case refers to a high-profile incident that occurred in Gaya, Bihar, India, on 7 May 2016."], ["Q125662629", "P31", "Q132821", "Murder of Inal Djabiev", "On August 28, 2020, in South Ossetia, the South Ossetian Police reported that a suspect in a murder plot against Igor Naniyev, the Minister of Internal Affairs, Inal Djabiev, had died in custody."], ["Q130365309", "P31", "Q132821", "Murder of Elisa Pomarelli", "On August 25, 2019, 28-year-old Elisa Pomarelli was murdered by her friend, 45-year-old Massim 91, Patricia Allen, a 31-year-old lawyer, was murdered by her estranged husband, Colin McGregor, with a crossbow in downtown Ottawa, Ontario, Canada."], ["Q133801099", "P31", "Q132821", "Murder of Jessie Blodgett", "Jessie Blodgett (March 22, 1994 – July 15, 2013) was an American college student, musician, and activist from Hartford, Wisconsin, who was murdered in her home by a former acquaintance, Daniel Bartelt."], ["Q134412839", "P31", "Q132821", "Murder of Ilyas Safiullin", "Ilyas Safovich Safiullin (Russian: Ильяс Сафович Сафиуллин; 10 November 1968 – 2 April 2025), baptized Ilya (Russian: Илья), was a Russian Orthodox altar server and handyman murdered in the Church of the Almighty Savior, in Moscow."], ["Q134740244", "P31", "Q132821", "Murder of Joan D'Alessandro", "On April 19, 1973, Joan D'Alessandro, a 7-year-old Girl Scout from New Jersey, was raped and murdered by her neighbor Joseph McGowan after she went to his house to sell cookies."], ["Q135350309", "P31", "Q132821", "Murder of Santosh Deshmukh", "The Santosh Deshmukh murder case concerns the abduction, torture, and murder of Santosh Deshmukh, the sarpanch of Massajog village in Beed district, Maharashtra, India, on 9 December 2024."], ["Q135903164", "P31", "Q132821", "Murder of Danny Croteau", "On April 15, 1972, Daniel Thomas Croteau, a 13-year-old Roman Catholic altar boy from Springfield, Massachusetts, was found murdered, floating in the Chicopee River, after disappearing the previous evening."], ["Q136335089", "P31", "Q132821", "Murder of Mark Carson", "On May 18, 2013, Mark Carson was fatally shot in the Greenwich Village neighborhood of New York City by Elliot Morales."], ["Q136813216", "P31", "Q132821", "Murder of John Horgan", "John Horgan was a seven-year-old Irish boy who was murdered by his 16 year old neighbour, Lorcan Bale, in Palmerstown, Dublin on 14 June 1973."], ["Q137799940", "P31", "Q132821", "Murder of Nicholas Fairles", "The murder of Nicholas Fairles took place on 11 June 1832
